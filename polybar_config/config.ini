[colors]
background = #000000
foreground = #C5C8C6
primary = #18BAEB

[bar/base]
monitor = ${env:MONITOR:}
background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2pt

border-size = 0pt
border-color = #00000000
padding-left = 0
padding-right = 1

margin-bottom = 0
border-bottom-size = 0

module-margin = 1

separator = |

modules-left = xworkspaces
modules-right = i3 memory cpu wlan date

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

[bar/laptop]
inherit = bar/base
font-0 = DejaVuSansMono:size=10;
width = 100%

[bar/hdmi]
inherit = bar/base
font-0 = DejaVuSansMono:size=8;
width = 100%

[module/systray]
type = internal/tray

format-margin = 8pt
tray-spacing = 16pt

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 1

[module/filesystem]
#type = internal/fs
#interval = 25

#mount-0 = /
#format-mounted = <label-mounted>
#label-mounted = %{F#18BAEB}Avail: %{F-}%free% 

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM: "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU: "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[network-base]
type = internal/network
interval = 2
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#F0C674}%ifname%%{F#707880} disconnected

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = %{F#18BAEB}%essid: %%{F-} DN -> %downspeed% UP -> %upspeed%

[module/date]
type = internal/date
interval = 1

date = %I:%M:%S %p

label = %date%
label-foreground = ${colors.foreground}

[module/i3]
type = internal/i3
pin-workspaces = true
strip-wsnumbers = true
index-sort = true

format = <label-mode>
label-mode = %mode%
label-mode-padding = 0
label-mode-background = #000000
label-mode-foreground = #FF0000

[settings]
screenchange-reload = true

